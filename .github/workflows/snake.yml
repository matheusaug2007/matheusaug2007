name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7CC4FF&color_dots=#ebedf0,#cfe6fa,#a6d2f7,#7CC4FF,#4a93c4
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#7CC4FF&color_dots=#161b22,#1b3a52,#2a5f87,#4a93c4,#7CC4FF

      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
